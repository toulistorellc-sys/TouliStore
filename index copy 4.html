<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111a2e"><title>Touli Store — Make it personal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;700;800&family=Dancing+Script:wght@600;700&display=swap');
:root{--ink:#111a2e;--orange:#ff7900;--cream:#fff8f0;--muted:#697386;--line:#e6e2dc;--bg:#f4f2ef;--white:#fff;--green:#0a7d4b;--shadow:0 10px 36px #1118271a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:15px}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.ic{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
/* header */
.topline{background:#0b1220;color:#fff;text-align:center;padding:7px 12px;font-size:12px;letter-spacing:.05em}
.header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.hrow{max-width:1280px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logoa{background:#fff;border-radius:10px;padding:4px 10px;display:flex}.logo{height:38px;width:auto;display:block}
.search{flex:1;display:flex;border-radius:10px;overflow:hidden;background:#fff;min-width:0}
.search select{border:0;background:#f1eee9;padding:0 10px;font-size:12px;color:var(--ink);border-right:1px solid var(--line);max-width:120px}
.search input{flex:1;border:0;padding:12px 14px;font-size:14px;min-width:0;outline:0;color:var(--ink)}
.search button{border:0;background:var(--orange);color:#fff;padding:0 18px}.search .ic{width:20px;height:20px}
.hbtn{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding:6px 8px;border-radius:8px;text-decoration:none;font-size:11px;white-space:nowrap}
.hbtn:hover{outline:1px solid #ffffff55}.hbtn b{font-size:13px}
.cartb{flex-direction:row;align-items:center;gap:6px}.cartb .ic{width:26px;height:26px}.cartb .n{background:var(--orange);color:#fff;border-radius:20px;font-size:11px;font-weight:800;padding:1px 7px}
.lang{position:relative}.lang button.cur{background:none;border:1px solid #ffffff33;border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:5px;color:#fff;opacity:.75;font-size:11px}
.lang button.cur:hover{opacity:1}.flag{width:18px;height:13px;object-fit:cover;border-radius:2px;display:block}
.langmenu{position:absolute;right:0;top:110%;background:#fff;color:var(--ink);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:none;min-width:130px}.langmenu.open{display:block}
.langmenu button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13px;text-align:left}.langmenu button:hover{background:var(--bg)}
.subnav{background:#1b2740;color:#fff}.subnav div{max-width:1280px;margin:auto;padding:0 18px;display:flex;gap:6px;overflow:auto;scrollbar-width:none}
.subnav a{padding:10px 12px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;border-radius:6px}.subnav a:hover{background:#ffffff1f}
/* layout */
#app{min-height:70vh}.wrap{max-width:1280px;margin:auto;padding:22px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:30px;padding:12px 22px;background:var(--orange);color:#fff;font-weight:800;text-decoration:none;transition:.2s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}.btn.dark{background:var(--ink)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.block{width:100%}.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 1px 8px #1118270d}
h1,h2,h3{font-family:Manrope,sans-serif;letter-spacing:-.02em;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:14px}.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
/* hero */
.hero{background:linear-gradient(112deg,#fff8f0,#ffe9d0 60%,#f9d9b9);overflow:hidden}
.hero-in{max-width:1280px;margin:auto;padding:54px 22px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.eyebrow{color:#d86a00;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.hero h1{font-size:clamp(38px,5vw,64px);line-height:1.03;letter-spacing:-.05em;margin:14px 0}.hero h1 span{color:var(--orange)}.hero p{color:#596273;line-height:1.7;max-width:480px;font-size:16px}
.hero-art{position:relative;min-height:330px}.hero-art img{position:absolute;object-fit:cover;border:8px solid #fff;border-radius:18px;box-shadow:var(--shadow)}
.hero-art img:nth-child(1){width:50%;height:270px;left:0;top:22px;transform:rotate(-7deg)}.hero-art img:nth-child(2){width:44%;height:235px;right:2%;top:0;transform:rotate(6deg)}.hero-art img:nth-child(3){width:46%;height:195px;right:14%;bottom:0;transform:rotate(-2deg)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-34px;position:relative;z-index:2}
.catcard{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);text-decoration:none}.catcard h3{font-size:17px}
.catcard .imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.catcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eee}.catcard span{color:#0a6ab5;font-size:13px;font-weight:600}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}.trust div{background:#fff;border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:700}.trust .ic{width:28px;height:28px;color:var(--orange);flex:none}
.sechead{display:flex;justify-content:space-between;align-items:end;margin:30px 0 14px}.sechead h2{font-size:26px;margin:0}.sechead a{color:#0a6ab5;font-size:13px;font-weight:600}
/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pc{background:#fff;border-radius:16px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;box-shadow:0 1px 8px #1118270d;transition:.2s}.pc:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.pc .im{aspect-ratio:1/1;background:#f3f0ec;overflow:hidden;position:relative}.pc .im img{width:100%;height:100%;object-fit:cover;transition:.4s}.pc:hover .im img{transform:scale(1.05)}
.tag{position:absolute;top:10px;left:10px;background:#fff;border-radius:30px;padding:5px 10px;font-size:10px;font-weight:800;color:#d76500}
.pc .in{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.pc h3{font-size:15px;margin:0;font-family:'DM Sans'}
.price{font-size:20px;font-weight:800}.price small{font-size:12px;font-weight:600;color:var(--muted)}
.stars{color:#f5a300;font-size:13px;letter-spacing:1px}
.pill{display:inline-flex;gap:6px;align-items:center;background:#fff2e4;color:#bd5900;border-radius:7px;padding:4px 8px;font-size:11px;font-weight:800;width:fit-content}
/* shop */
.shop{display:grid;grid-template-columns:230px 1fr;gap:22px}.side{background:#fff;border-radius:16px;padding:18px;height:fit-content;position:sticky;top:130px}
.side h4{margin:14px 0 8px;font-size:13px}.side h4:first-child{margin-top:0}.side a{display:block;padding:5px 0;font-size:13px;text-decoration:none;color:#334}.side a.on{font-weight:800;color:var(--orange)}
.side label{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}.toolbar select{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
/* product page */
.pp{display:grid;grid-template-columns:1.05fr 1fr;gap:34px}.gal{position:sticky;top:130px;height:fit-content}
.gmain{background:#fff;border-radius:18px;overflow:hidden;aspect-ratio:1;position:relative}.gmain img{width:100%;height:100%;object-fit:cover}
.gtabs{display:flex;gap:8px;margin-bottom:10px}.gtabs button{border:1px solid var(--line);background:#fff;border-radius:30px;padding:7px 14px;font-size:12px;font-weight:700}.gtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prev{aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);transition:background .25s}
.prev .shape{width:62%;height:74%;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;position:relative;box-shadow:0 14px 34px #0003;transition:background .25s;overflow:hidden}
.prev .shape.round{border-radius:26px}.prev .shape.wide{width:78%;height:56%}.prev .shape.tall{width:36%;height:84%;border-radius:20px}
.prev .ph{width:84%;flex:1;min-height:0;border-radius:12px;background:#ffffff40 center/cover no-repeat;border:2px dashed #ffffff90;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-align:center;padding:6px}
.prev .ph.has{border:0}.prev .tx{font-family:'Dancing Script',cursive;font-size:30px;line-height:1.05;text-align:center;word-break:break-word;max-width:100%}
.prev .note{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#667}
.pi h1{font-size:28px;line-height:1.15}.pi .ratingrow{display:flex;gap:8px;align-items:center;margin:6px 0 12px;font-size:13px}
.pi .big{font-size:32px;font-weight:800}.opt{margin:18px 0}.opt>label{font-weight:700;font-size:13px;display:block;margin-bottom:8px}.opt>label span{font-weight:500;color:var(--muted)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbb;padding:0}.sw button.on{box-shadow:0 0 0 3px var(--orange)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{border:1px solid #ccc;background:#fff;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600}.chips button.on{border-color:var(--orange);background:#fff2e4;color:#b35300}
.field{width:100%;border:1px solid #cfc9c0;border-radius:10px;padding:12px;background:#fff}textarea.field{min-height:76px;resize:vertical}
.buybox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}.buybox .row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.qtysel{display:inline-flex;align-items:center;border:1px solid #ccc;border-radius:30px;overflow:hidden;background:#fff}.qtysel button{border:0;background:none;width:34px;height:34px;font-size:18px}.qtysel span{min-width:28px;text-align:center;font-weight:700}
.green{color:var(--green);font-weight:700}.tabs-sec{margin-top:36px}
.det li{margin:6px 0;line-height:1.5}
.reviews{display:grid;grid-template-columns:260px 1fr;gap:26px}.rev{border-bottom:1px solid var(--line);padding:14px 0}
/* cart */
.cartpg{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start}
.cl{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}.cl img{width:96px;height:96px;border-radius:12px;object-fit:cover;background:#eee}
.cl h4{margin:0 0 4px;font-size:15px}.cl .opts{font-size:12px;color:var(--muted);line-height:1.6}.cl .acts{display:flex;gap:14px;align-items:center;margin-top:8px;font-size:12px}.cl .acts a{color:#0a6ab5;cursor:pointer}
.sum .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}.sum .t{font-weight:800;font-size:19px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.bar{height:8px;border-radius:8px;background:#eee;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--green)}
/* checkout */
.cochead{background:#fff;border-bottom:1px solid var(--line)}.cochead div{max-width:1000px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.cogrid{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}.step{background:#fff;border-radius:14px;margin-bottom:14px;border:1px solid var(--line)}
.step>.sh{display:flex;justify-content:space-between;padding:16px 20px;font-weight:800;gap:10px}.step>.sh .num{color:var(--orange);margin-right:8px}.step .sb{padding:0 20px 20px}.step.lock .sb{display:none}.step.lock{opacity:.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fl{display:block;font-size:12px;font-weight:700;margin-bottom:12px}.fl .field{margin-top:5px;font-weight:400}
.radio{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}.radio.on{border-color:var(--orange);background:#fff8f0}.radio b{display:block}
#pay{margin:14px 0;min-height:48px}.secure{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:10px}.secure .ic{color:var(--green)}
/* auth */
.auth{max-width:420px;margin:30px auto}.auth .field{margin-bottom:12px}.sso{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;border:1px solid #ccc;background:#fff;border-radius:30px;padding:12px;font-weight:700;margin-bottom:10px}
.sso:hover{background:var(--bg)}.sso.ap{background:#000;color:#fff;border-color:#000}.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:#c0262d;font-size:12px;margin:-4px 0 10px}
/* info pages */
.doc{max-width:820px;margin:auto}.doc h1{font-size:34px}.doc h3{margin-top:24px}.doc p,.doc li{line-height:1.75;color:#3b4457}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}.faq summary{font-weight:700;cursor:pointer}
.crow{display:flex;gap:12px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:14px;margin-top:12px;text-decoration:none;font-weight:700;background:#fff}.crow .ic{color:var(--orange);width:22px;height:22px}
/* footer */
.footer{background:#1b2740;color:#fff;margin-top:50px}.footer .top{text-align:center;padding:14px;background:#2a3857;font-size:13px;cursor:pointer}
.fgrid{max-width:1100px;margin:auto;padding:44px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:30px}.fgrid h4{margin:0 0 12px;font-size:15px}.fgrid a{display:block;color:#c6ccda;text-decoration:none;font-size:13px;padding:5px 0}.fgrid a:hover{color:#fff;text-decoration:underline}
.fend{border-top:1px solid #344056;padding:24px;text-align:center;font-size:12px;color:#aeb7c7}.fend .logoplate{display:inline-block;background:#fff;border-radius:14px;padding:8px 18px;margin-bottom:12px}.fend img{height:36px;display:block}
.fend .soc{display:flex;gap:22px;justify-content:center;margin-bottom:14px}.fend .soc .ic{width:24px;height:24px}
/* misc */
.modal{position:fixed;inset:0;background:#10182799;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}
.modalbox{background:#fff;border-radius:20px;padding:24px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;z-index:60;font-size:13px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:60px 10px}.empty .ic{width:56px;height:56px;color:#bbb}
.ok{width:72px;height:72px;border-radius:50%;background:#e4f6ec;color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}.ok .ic{width:38px;height:38px}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}.cats{grid-template-columns:repeat(2,1fr)}.shop{grid-template-columns:1fr}.side{position:static}.pp,.cartpg,.cogrid,.reviews{grid-template-columns:1fr}.gal{position:static}.fgrid{grid-template-columns:1fr 1fr}.hero-in{grid-template-columns:1fr}.hero-art{max-width:520px;width:100%;margin:auto}}
@media(max-width:640px){.hrow{flex-wrap:wrap;padding:8px 12px;gap:8px}.logo{height:30px}.search{order:5;flex-basis:100%}.search select{display:none}.hbtn .hide-m{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.trust{grid-template-columns:repeat(2,1fr)}.pc .in{padding:10px}.pc h3{font-size:13px}.price{font-size:17px}.wrap{padding:16px 12px}.two{grid-template-columns:1fr}.hero-in{padding:36px 18px}.hero-art{min-height:250px}.hero-art img:nth-child(1){height:200px}.hero-art img:nth-child(2){height:180px}.hero-art img:nth-child(3){height:150px}.cl{grid-template-columns:72px 1fr}.cl img{width:72px;height:72px}.cl>.pr{grid-column:2}.fgrid{grid-template-columns:1fr}.catcard h3{font-size:14px}.cats{margin-top:-20px;gap:10px}}

/* v2: logo plate, compact search, gallery, phone picker */
.logoa{background:linear-gradient(135deg,#fffaf3,#ffe6c9);border-radius:14px;padding:5px 14px;box-shadow:0 0 0 2px #ff790066,0 4px 14px #0003}.logo{height:42px}
.search{flex:0 1 460px;margin:0 auto;border-radius:999px;padding:3px 3px 3px 8px;align-items:center;box-shadow:0 2px 10px #0003}
.search select{background:transparent;border:0;border-right:1px solid var(--line);font-size:12px;max-width:92px;padding:0 6px;height:30px}
.search input{padding:8px 12px;font-size:13px}.search button{width:34px;height:34px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex:none}.search .ic{width:16px;height:16px}
.fend .logoplate{background:linear-gradient(135deg,#fffaf3,#ffe6c9);box-shadow:0 0 0 2px #ff790066}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow:auto;scrollbar-width:thin}.thumbs button{width:68px;height:68px;flex:none;border:2px solid var(--line);border-radius:12px;background:#f3f0ec;padding:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}.thumbs button.on{border-color:var(--orange)}.thumbs img,.thumbs .psvg{width:100%;height:100%;object-fit:cover}
.prev .psvg{height:96%;width:auto;max-width:100%}.vlbl{position:absolute;top:10px;left:12px;font-size:11px;font-weight:800;background:#fff;border-radius:20px;padding:4px 10px;color:#d76500}
.chips.brand button{min-width:96px}

/* ===== v3: light 2026 header, transparent PNG logo sits directly on it ===== */
:root{--bg:#faf7f2}
.topline{background:linear-gradient(90deg,#ff7900,#ff9a2e 50%,#ff7900);color:#fff;font-weight:700;letter-spacing:.04em;padding:8px 12px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.topline .ic{width:18px;height:18px;stroke-width:2}.topline .fs{background:#fff;color:#c75a00;border-radius:999px;padding:2px 12px;font-weight:800}.topline .pm{opacity:.95}
.header{background:rgba(255,253,249,.88);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);color:var(--ink);border-bottom:1px solid #eee6da;box-shadow:0 6px 24px #1a12060d}
.hrow{padding:12px 20px;gap:18px}
.logoa{background:none;box-shadow:none;border-radius:0;padding:0;display:flex;align-items:center}.logo{height:48px;width:auto}
.search{flex:1 1 520px;max-width:620px;background:#fff;border:2px solid var(--orange);box-shadow:0 4px 16px #ff79001f;padding:3px 3px 3px 10px}
.search select{color:var(--ink);border-right:1px solid #eee6da}
.search button{background:linear-gradient(135deg,#ff8a1f,#ff6a00)}
.hbtn{color:var(--ink)}.hbtn:hover{outline:0;background:#fff1e2}
.cartb .ic{color:var(--ink)}
.lang button.cur{color:var(--ink);border:1px solid #e6dccd;opacity:1;background:#fff}
.subnav{background:#fff;border-top:1px solid #f0e9de;color:var(--ink)}
.subnav a{color:#3b4458;border-radius:999px;margin:6px 0;padding:7px 14px}.subnav a:hover{background:#fff1e2;color:#c75a00}
.fend .logoplate{background:#fff;box-shadow:0 0 0 2px #ff790066}
@media(max-width:640px){.logo{height:34px}.hrow{padding:8px 12px}.search{flex-basis:100%;max-width:none}.topline{font-size:11px;gap:6px}}
.gsi-wrap{display:flex;justify-content:center;margin-bottom:10px;min-height:44px}

/* ===== v4: light footer, no plate behind logo, AI assistant, contact page ===== */
.footer{background:linear-gradient(180deg,#fff6ea,#ffe8cf);color:var(--ink);margin-top:50px;border-top:1px solid #f1d9b9}
.footer .top{background:linear-gradient(90deg,#ff7900,#ff9a2e);color:#fff;font-weight:700}
.fgrid h4{color:var(--ink)}.fgrid a{color:#4a5368}.fgrid a:hover{color:#c75a00;text-decoration:none}

const A=k=>((AI_T[lang]&&AI_T[lang][k])||AI_T.en[k]);
const aiTx=()=>AI_T[lang]||AI_T.en;
const AI_KW={order:['track','status','where is','order','kòmand','komand','swiv','pedido','commande'],ship:['ship','deliver','livr','envío','envio','free','gratis','delivery'],returns:['return','refund','damag','retou','rembours','devol','broken','wrong'],custom:['custom','bulk','wedding','business','kantite','espesyal','mayaj','maryaj'],pay:['pay','card','paypal','peman','peye','kat','tarjeta','carte'],person:['person','human','agent','call','phone','talk','pale','moun','telefon','email','contact','imèl','rele','help','èd','ayuda','aide']};
function aiAdd(html,who){let m=$('aiMsgs');m.insertAdjacentHTML('beforeend',`<div class="aib ${who}">${html}</div>`);m.scrollTop=m.scrollHeight}
function aiQuick(){let T=aiTx().topics?aiTx():AI_T.en,tp=A('topics');return `<div class="aiq">${Object.keys(tp).map(k=>`<button class="${k==='person'?'p':''}" onclick="aiAsk('${k}')">${tp[k]}</button>`).join('')}</div>`}
function aiBuild(){$('aiBox').innerHTML=`<div class="aih"><div class="av">${ic('spark')}</div><div><b>${A('title')}</b><small>${A('sub')}</small></div><button onclick="aiClose()" aria-label="Close">×</button></div><div id="aiMsgs"></div><form class="aif" onsubmit="return aiSend(event)"><input id="aiIn" placeholder="${A('ph')}" autocomplete="off"><button aria-label="Send">➤</button></form>`;aiAdd(A('hi'),'bot');aiAdd(aiQuick(),'bot')}
function aiOpen(topic){if(!$('aiMsgs')||$('aiBox').dataset.l!==lang){aiBuild();$('aiBox').dataset.l=lang}
 $('aiBox').classList.add('open');$('aiFab').style.display='none';if(topic)aiAsk(topic,true);else setTimeout(()=>$('aiIn').focus(),50)}
function aiClose(){$('aiBox').classList.remove('open');$('aiFab').style.display=''}
function aiPerson(){let a=A('steps');aiAdd(`<h4>${A('personTitle')}</h4>${A('personIntro')}<ol class="steps">${a.map(x=>`<li><span>${x}</span></li>`).join('')}</ol><a class="crow" href="tel:${STORE.tel}">${ic('tel')}<span>${A('call')}<br><small class="muted">${STORE.phone}</small></span></a><a class="crow" href="mailto:${STORE.email}">${ic('mail')}<span>${A('mail')}<br><small class="muted">${STORE.email}</small></span></a><a class="crow" href="#/page/contact" onclick="aiClose()">${ic('pen')}<span>${A('form')}</span></a><a class="crow" href="#/page/help" onclick="aiClose()">${ic('spark')}<span>${A('faq')}</span></a>`,'bot')}
function aiAsk(k,silent){let tp=A('topics');if(!silent)aiAdd(esc(tp[k]),'me');
 if(k==='person')aiPerson();else aiAdd(A('ans')[k],'bot');
 aiAdd(A('more')+aiQuick(),'bot')}
function aiSend(e){e.preventDefault();let i=$('aiIn'),q=i.value.trim();if(!q)return false;i.value='';aiAdd(esc(q),'me');let lq=q.toLowerCase(),best=null,sc=0;
 for(const k in AI_KW){let n=AI_KW[k].filter(w=>lq.includes(w)).length;if(n>sc){sc=n;best=k}}
 if(!best){aiAdd(A('noMatch')+'<div class="aiq" style="margin-top:8px"><button class="p" onclick="aiAsk(\'person\')">'+A('topics').person+'</button></div>','bot')}
 else{if(best==='person')aiPerson();else aiAdd(A('ans')[best],'bot');aiAdd(A('more')+aiQuick(),'bot')}return false}
function cSend(e){e.preventDefault();let v=id=>$(id).value.trim(),body=`Name: ${v('cfn')}\nEmail: ${v('cfe')}\nOrder #: ${v('cfo')||'-'}\n\n${v('cfm')}`;
 location.href=`mailto:${STORE.email}?subject=${encodeURIComponent('Touli Store · '+$('cft').value)}&body=${encodeURIComponent(body)}`;toast('Opening your email app…');return false}
document.body.insertAdjacentHTML('beforeend',`<button id="aiFab" onclick="aiOpen()" aria-label="Ask Touli AI">${ic('spark')}<span>${A('fab')}</span></button><div id="aiBox" role="dialog" aria-label="Assistant"></div>`);

renderChrome();route();setTimeout(oneTap,1500);
